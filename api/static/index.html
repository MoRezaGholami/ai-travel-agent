<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/chat.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <div class="layout">
    <aside class="sidebar" aria-label="Past chats">
      <div class="sidebar-head">
        <p class="sidebar-brand">Travel Agent</p>
        <button type="button" id="newChatBtn" class="primary compact">New chat</button>
      </div>
      <div id="threadList" class="thread-list"></div>
      <p id="threadEmpty" class="thread-empty" hidden>No saved chats yet.</p>
    </aside>

    <div class="workspace">
      <header class="top">
        <div class="brand">
          <p class="brand-mark" id="chatTitle">New chat</p>
          <p class="brand-sub">Plan, compare, book — with your approval</p>
        </div>
        <div class="meta">
          <span id="threadChip" class="chip" title="Conversation thread">thread…</span>
          <button type="button" id="sidebarToggle" class="ghost mobile-only">Chats</button>
        </div>
      </header>

      <main class="shell">
        <div id="liveStatus" class="live-status" hidden>
          <span class="pulse" aria-hidden="true"></span>
          <span id="liveStatusText">Working…</span>
        </div>

        <section id="log" class="log" aria-live="polite"></section>

        <aside id="approval" class="approval" hidden>
          <h2>Approval needed</h2>
          <p class="approval-hint">No booking or cancel runs until you confirm.</p>
          <pre id="pendingBox" class="pending"></pre>
          <div class="approval-actions">
            <button type="button" id="approveBtn" class="primary">Approve</button>
            <button type="button" id="rejectBtn" class="danger">Reject</button>
          </div>
        </aside>

        <form id="composer" class="composer">
          <label class="sr-only" for="message">Message</label>
          <textarea id="message" rows="2" placeholder="e.g. Find flights Tehran to Istanbul on 2026-11-10" required></textarea>
          <button type="submit" id="sendBtn" class="primary">Send</button>
        </form>
        <p id="statusLine" class="status" aria-live="polite"></p>
      </main>
    </div>
  </div>

  <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>
  <script src="/static/chat.js"></script>
</body>
</html>
